name: Release

# Push a tag like v0.2.0 to publish a new downloadable build.
on:
  push:
    tags: ['v*']
  # Re-run for an existing tag from the Actions tab if a tag push was missed.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run zip
      - run: gh release create "$GITHUB_REF_NAME" fit-everywhere.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
